aid: edge-case-research
name: Edge Case Research
description: 'Edge Case Research (operating as "Edge Case", ecr.ai) is a Pittsburgh, Pennsylvania
  company founded in 2013 that provides functional safety engineering, risk management and
  safety-assurance software for autonomous and other "frontier technology" systems. Its
  DevSafeOps methodology carries safety through the whole product lifecycle — hazard
  identification in design, verified safety evidence in build, and continuous safety monitoring
  in operations — and its nLoop live-safety-case platform assembles evidence from design,
  simulation, test and field operations into an auditable, continuously updated safety case.
  The company works across aerospace and defense, automotive and autonomous trucking, space,
  oil and gas, and supply chain and logistics, and publishes the Open Autonomy Safety Case
  framework as SACM XML on GitHub. Edge Case publishes no public product API or OpenAPI; the
  only machine-readable surface reachable on its own host is the Wix-provided site MCP endpoint
  advertised in its llms.txt.'
