server:
  name: edge-case-site-mcp
  transport: http
  url: https://www.ecr.ai/_api/mcp
  authentication: none
  note: >-
    This is the Wix platform "site MCP" served from Edge Case's own host and advertised by
    Edge Case's llms.txt. It is NOT an Edge Case product API — it exposes public site content,
    business details, site search, and generic Wix business-solution API access (blog, bookings,
    ecommerce, events). Edge Case publishes no OpenAPI and no product API of its own, so there is
    no REST surface to crosswalk these tools against.
  platform: Wix Site MCP
  platform_docs: https://dev.wix.com/docs/develop-websites/articles/get-started/about-the-wix-site-mcp
