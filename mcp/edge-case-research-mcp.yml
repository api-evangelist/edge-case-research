site_capabilities:
  source: tools/call GetBusinessDetails (anonymous, HTTP 200)
  apps:
  - Blog App — list and query blog posts
  - Bookings App — list/query services, book an appointment, check availability, list staff
  - Ecommerce App — manage cart, open checkout for a cart
  - Events App — list and query events, RSVP to an event
tools:
- name: GetBusinessDetails
  description: Returns business and site details (timezone, email, phone, address, site name,
    business name, description, schedule) plus the site features available to other tools.
  parameters: []
  read_only: true
- name: SearchInSite
  description: Full-text search across the site for information.
  parameters:
  - {name: searchTerm, required: true, type: string}
  read_only: true
- name: SearchSiteApiDocs
  description: Searches the API documentation for the Wix business solutions installed on this
    site and explains how to call them.
  parameters:
  - {name: searchTerm, required: true, type: string}
  read_only: true
- name: GenerateVisitorToken
  description: Creates a visitor session and returns a visitor access token; prerequisite for
    CallWixSiteAPI and ExecuteWixAPI.
  parameters: []
  read_only: false
- name: CallWixSiteAPI
  description: Calls a Wix API method on the visitor's behalf (query site data, book an
    appointment, start a purchase).
  parameters:
  - {name: visitorToken, required: true, type: string}
  - {name: url, required: true, type: string, format: uri}
  - {name: method, required: true, type: string}
  - {name: body, required: false, type: string}
  read_only: false
- name: ExecuteWixAPI
  description: Runs a sandboxed JavaScript async function against the Wix REST API on the
    visitor's behalf, chaining multiple calls in one step.
  parameters:
  - {name: code, required: true, type: string}
  - {name: reason, required: true, type: string}
  - {name: hasMutations, required: true, type: boolean}
  - {name: sourceDocUrls, required: true, type: array}
  - {name: visitorToken, required: true, type: string}
  read_only: false
  destructive: true
- name: BrowseWixRESTDocsMenu
  description: Browses the Wix REST API documentation menu hierarchy.
  parameters:
  - {name: menuUrl, required: false, type: string}
  - {name: reason, required: true, type: string}
  read_only: true
- name: ReadFullDocsArticle
  description: Fetches a complete article from the Wix developer documentation portal.
  parameters:
  - {name: articleUrl, required: true, type: string, format: uri}
  read_only: true
- name: ReadFullDocsMethodSchema
  description: Fetches the full request/response schema for a Wix API method.
  parameters:
  - {name: articleUrl, required: true, type: string, format: uri}
  - {name: reason, required: true, type: string}
  read_only: true
observations:
- >-
  Several tool descriptions carry an <agent-mandatory-instructions> block instructing the calling
  agent that it "MUST READ AND FOLLOW" them. These are Wix platform-authored, not Edge Case
  authored, but they are served from ecr.ai and are worth recording as an agent-instruction
  surface embedded in a tool description.
- >-
  ExecuteWixAPI is annotated readOnlyHint:false / destructiveHint:true and accepts arbitrary
  JavaScript executed against the Wix REST API on a visitor's behalf.
- >-
  No tool crosswalk is emitted: there is no Edge Case OpenAPI or GraphQL surface to bind these
  tools to.
